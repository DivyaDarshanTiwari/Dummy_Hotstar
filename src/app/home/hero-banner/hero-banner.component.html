<div class="hero-image">
  <div class="logo">
    <img src="/ANIME-W (1).gif" alt="Anime watermark" />
  </div>

  <div class="hero-text">
    <div class="brand">
      <img src="/One-Piece-Logo.png" alt="One Piece logo" />
    </div>

    <div class="meta">
      <span><span>2024</span></span>
      <span><span class="dot">4 Season</span></span>
      <span><span class="dot">7 Language</span></span>
      <span><span class="dot">U/A 7+</span></span>
    </div>

    <p class="synopsis">
      NEW EPISODE EVERY THURSDAY. As the war intensifies in Ravan's majestic
      Lanka, Hanuman faces mightier foes for his Lord Ram with his vaanar sena.
    </p>

    <div class="tags">
      <span>Mythology</span>
      <span><span class="line">Animation</span></span>
      <span><span class="line">Creatures &amp; Monsters</span></span>
      <span><span class="line">Fantasy</span></span>
    </div>

    <div class="example-button-container">
      <button mat-fab extended id="sub_button" aria-label="Subscribe to watch">
        <mat-icon>subscriptions</mat-icon>
        Subscribe To Watch
      </button>
      <button
        mat-fab
        aria-label="Add to Watch List"
        style="border-radius: 1rem"
        title="Watch List"
      >
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </div>
</div>
