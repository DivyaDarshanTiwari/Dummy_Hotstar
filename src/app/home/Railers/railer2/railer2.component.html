<section class="slider-section">
  <h2>Latest Release</h2>

  <div
    #track
    class="card-container"
    tabindex="0"
    aria-label="Latest releases carousel"
  >
    <div class="images" *ngFor="let i of item">
      <a [routerLink]="['/s']">
        <img
          [src]="i.img"
          [alt]="i.alt"
          (click)="emitImage(i)"
          [matTooltip]="i.title"
        />
      </a>
    </div>
  </div>

  <button
    mat-mini-fab
    class="prev"
    aria-label="Previous"
    color="primary"
    #prevButton
    (click)="prevfun()"
  >
    <mat-icon>arrow_back_ios</mat-icon>
  </button>

  <button
    mat-mini-fab
    class="next"
    aria-label="Next"
    color="primary"
    #nextButton
    (click)="nextfun()"
  >
    <mat-icon>arrow_forward_ios</mat-icon>
  </button>
</section>
