<section
  class="hero-image"
  [style.--banner-bg]="bgStyle()"
  [style.--banner-bg-mobile]="bgMobileStyle()"
>
  <div class="logo" aria-hidden="true">
    <img src="/assets/ANIME-W (1).gif" alt="" />
  </div>

  <div class="hero-text">
    <div
      class="brand"
      *ngIf="
        bannerModel?.titleImgUrl || bannerModel?.titleAlt;
        else fallbackTitle
      "
    >
      <img
        [src]="bannerModel?.titleImgUrl || '/assets/One-Piece-Logo.png'"
        [alt]="bannerModel?.titleAlt || 'Title logo'"
      />
    </div>
    <ng-template #fallbackTitle>
      <h1 class="fallback-title">{{ bannerModel?.titleAlt || "Featured" }}</h1>
    </ng-template>

    <div class="meta" *ngIf="(bannerModel?.meta?.length || 0) > 0">
      <ng-container *ngFor="let m of bannerModel!.meta; let i = index">
        <span>
          <span [class.dot]="i > 0">{{ m }}</span>
        </span>
      </ng-container>
    </div>

    <p class="synopsis" *ngIf="bannerModel?.synopsis">
      {{ bannerModel!.synopsis }}
    </p>

    <div class="tags" *ngIf="(bannerModel?.genres?.length || 0) > 0">
      <ng-container *ngFor="let g of bannerModel!.genres; let i = index">
        <span
          ><span [class.line]="i > 0">{{ g }}</span></span
        >
      </ng-container>
    </div>

    <div class="example-button-container">
      <button
        mat-fab
        extended
        id="sub_button"
        type="button"
        aria-label="Subscribe to watch"
        (click)="logIn()"
      >
        <mat-icon>subscriptions</mat-icon>
        Subscribe To Watch
      </button>

      <button
        mat-fab
        type="button"
        [attr.aria-pressed]="add_to_watchList"
        [title]="
          add_to_watchList ? 'Remove from Watch List' : 'Add to Watch List'
        "
        (click)="toggleWatchList()"
        style="border-radius: 1rem"
      >
        <mat-icon>{{ add_to_watchList ? "check" : "add" }}</mat-icon>
      </button>
    </div>
  </div>
</section>
