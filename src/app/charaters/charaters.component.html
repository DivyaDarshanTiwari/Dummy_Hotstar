<form class="form" role="search" (ngSubmit)="search()">
  <!-- accessible label for screen readers -->
  <label class="sr-only" for="character-input">Character name</label>
  <input
    id="character-input"
    type="text"
    placeholder="Enter character name"
    name="character"
    [(ngModel)]="searched_name"
    (keyup.enter)="search()"
    aria-label="Character name"
    autocomplete="off"
  />
  <!-- keep existing click handler; add Material styling -->
  <button
    type="button"
    class="button"
    (click)="search()"
    mat-flat-button
    color="primary"
    aria-label="Search characters"
  >
    Search
  </button>
</form>

<p
  class="results"
  aria-live="polite"
  *ngIf="character_Data?.length !== undefined"
>
  {{ character_Data?.length || 0 }} result{{
    (character_Data?.length || 0) === 1 ? "" : "s"
  }}
</p>

<div class="container" role="list" aria-label="Characters">
  <div *ngFor="let item of character_Data" class="card" role="listitem">
    <mat-card
      class="example-card mat-elevation-z2"
      appearance="outlined"
      tabindex="0"
      (click)="selectedCharater(item)"
      (keyup.enter)="selectedCharater(item)"
      [matTooltip]="item.name"
    >
      <mat-card-header>
        <mat-card-title class="films" [matTooltip]="item.name">
          {{ item.name }}
        </mat-card-title>
        <mat-card-subtitle
          class="films"
          [matTooltip]="getFilmsTooltip(item.films)"
        >
          Films: {{ formatFilmsInline(item.films) }}
        </mat-card-subtitle>
      </mat-card-header>

      <img
        mat-card-image
        [lazyLoad]="item.imageUrl || placeholderImage"
        [defaultImage]="placeholderImage"
        [alt]="item.name"
        class="image"
      />
      <mat-card-content>
        <p>
          <a [routerLink]="['/s']" (click)="selectedCharater(item)"
            >Learn more</a
          >
        </p>
      </mat-card-content>
    </mat-card>
  </div>
</div>
