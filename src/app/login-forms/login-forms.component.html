<div class="login-wrap">
  <div
    class="login-box"
    role="dialog"
    aria-labelledby="loginTitle"
    aria-describedby="loginDesc"
  >
    <h2 id="loginTitle" class="login-title">Sign in</h2>
    <p id="loginDesc" class="sr-only">
      Enter username and password to sign in.
    </p>

    <form
      [formGroup]="form"
      (ngSubmit)="onSubmit()"
      [attr.aria-busy]="isSubmitting"
      novalidate
    >
      <div class="user-box">
        <input
          #userNameInput
          type="text"
          formControlName="user_name"
          id="user_name"
          name="user_name"
          required
          autocomplete="username"
          [attr.aria-invalid]="
            f.user_name.invalid && (submitted || f.user_name.touched)
          "
          [attr.aria-describedby]="
            f.user_name.invalid && (submitted || f.user_name.touched)
              ? 'userNameError'
              : null
          "
          placeholder=" "
        />
        <label for="user_name">Username</label>
        <div
          class="error"
          *ngIf="f.user_name.invalid && (submitted || f.user_name.touched)"
          id="userNameError"
          aria-live="polite"
        >
          <span *ngIf="f.user_name.errors?.['required']">
            Username is required.
          </span>
          <span *ngIf="wrong_user">Incorrect username.</span>
        </div>
      </div>

      <div class="user-box">
        <input
          #passwordInput
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          [attr.aria-invalid]="
            f.password.invalid && (submitted || f.password.touched)
          "
          [attr.aria-describedby]="
            f.password.invalid && (submitted || f.password.touched)
              ? 'passwordError'
              : null
          "
          placeholder=" "
        />
        <label for="password">Password</label>

        <button
          type="button"
          class="toggle-pass"
          (click)="togglePasswordVisibility()"
          [attr.aria-pressed]="showPassword"
          [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
        >
          {{ showPassword ? "Hide" : "Show" }}
        </button>

        <div
          class="error"
          *ngIf="f.password.invalid && (submitted || f.password.touched)"
          id="passwordError"
          aria-live="polite"
        >
          <span *ngIf="f.password.errors?.['required']">
            Password is required.
          </span>
          <span *ngIf="f.password.errors?.['minlength']">
            Password must be at least 6 characters.
          </span>
          <span *ngIf="wrong_pass">Incorrect password.</span>
        </div>
      </div>

      <div class="form-status sr-only" aria-live="polite" *ngIf="isSubmitting">
        Submitting…
      </div>

      <button
        class="submit-btn"
        type="submit"
        [disabled]="isSubmitting || form.invalid"
      >
        <span class="btn-label">Enter</span>
        <span
          class="btn-spinner"
          *ngIf="isSubmitting"
          aria-hidden="true"
        ></span>
      </button>
    </form>
  </div>
</div>
